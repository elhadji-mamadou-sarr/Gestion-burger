name: Laravel CI/CD Pipeline

on:
  push:
    branches:
      - elhadji_sarr_burger  
  pull_request:
    branches:
      - elhadji_sarr_burger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Configuration de PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'  
          extensions: mbstring, dom, fileinfo, mysql, sqlite, curl, xml, ctype, json, bcmath, tokenizer, pdo, pdo_mysql
          coverage: none

      # Étape 3 : Installation des dépendances Composer
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      # # Étape 4 : Exécution des tests (optionnel)
      # - name: Run tests
      #   run: php artisan test

  build-docker-image:
    runs-on: ubuntu-latest
    needs: build  # Ce job dépend du job "build"

    steps:
      # Étape 1 : Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Construction de l'image Docker
      - name: Build Docker image
        run: |
          docker build -t elhadji_sarr_burger_image .

  push-docker-image:
    runs-on: ubuntu-latest
    needs: build-docker-image  # Ce job dépend du job "build-docker-image"
    if: github.event_name == 'push'  # Exécuter uniquement sur un événement "push"

    steps:
      # Étape 1 : Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Vérifier que l'image existe
      - name: Verify Docker image exists
        run: |
          docker images
          docker inspect elhadji_sarr_burger_image

      # Étape 3 : Connexion à Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Étape 4 : Tag et push de l'image Docker
      - name: Push Docker image to Docker Hub
        run: |
          docker tag elhadji_sarr_burger_image ${{ secrets.DOCKER_USERNAME }}/elhadji_sarr_burger_image:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/elhadji_sarr_burger_image:latest
